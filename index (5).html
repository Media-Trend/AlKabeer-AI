<style>
:root{
  --bg:#F4F0EC; --panel:#FFFFFF; --ink:#2B1D16; --muted:#7A6A60;
  --nile:#5A3E2E; --nile-ink:#FFFFFF; --sand:#E6DAD0; --line:#DDD2C8; --err:#B3321F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1411; --panel:#251C17; --ink:#F0E6DD; --muted:#B3A092;
    --nile:#C49A7A; --nile-ink:#1A1411; --sand:#34281F; --line:#3A2E26; --err:#FF8B79;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1411; --panel:#251C17; --ink:#F0E6DD; --muted:#B3A092;
  --nile:#C49A7A; --nile-ink:#1A1411; --sand:#34281F; --line:#3A2E26; --err:#FF8B79;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  font-size:17px;line-height:1.7;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
header{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.logo{
  width:42px;height:42px;border-radius:50%;background:var(--nile);color:var(--nile-ink);
  overflow:hidden;background:#fff;flex:none;
}
.logo img{width:100%;height:100%;display:block}
.title{flex:1;min-width:0}
.title b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.title span{font-size:13px;color:var(--muted)}
.icon-btn{
  border:1px solid var(--line);background:transparent;color:var(--ink);
  width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;
}
.icon-btn:hover{background:var(--bg)}
.icon-btn:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--nile);outline-offset:2px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-top-right-radius:4px}
.msg.user{align-self:flex-end;background:var(--nile);color:var(--nile-ink);border-top-left-radius:4px}
.msg.err{border-color:var(--err);color:var(--err)}
.meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.meta button{border:0;background:none;color:var(--nile);cursor:pointer;font:inherit;font-size:13px;padding:2px 4px}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px}
.chips button{
  border:1px solid var(--line);background:var(--sand);color:var(--ink);
  border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;
}
form{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
textarea{
  flex:1;resize:none;max-height:130px;min-height:46px;padding:10px 14px;
  border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);
  font:inherit;font-size:17px;line-height:1.5;
}
.send,.mic{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;font-size:19px;flex:none}
.send{background:var(--nile);color:var(--nile-ink)}
.send:disabled{opacity:.5;cursor:not-allowed}
.mic{background:var(--sand);color:var(--ink)}
.mic.on{background:var(--err);color:#fff}
dialog{
  margin:auto;width:min(92vw,480px);max-height:90vh;overflow:auto;
  border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);padding:20px;
}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{font-size:20px;margin-bottom:12px}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:15px}
input[type=password],input[type=text],select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px;direction:ltr;text-align:left;
}
select{direction:rtl;text-align:right}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}
.row input{width:20px;height:20px}
.row label{margin:0;font-weight:500}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;margin-top:18px}

    <div class="title"><b>AlKabeer AI</b><span id="status">الكبير · جاهز يا بيه</span></div>
    <button class="icon-btn" id="clearBtn" title="محادثة جديدة" aria-label="محادثة جديدة">🗑</button>
    <button class="icon-btn" id="setBtn" title="الإعدادات" aria-label="الإعدادات">⚙</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div class="chips" id="chips">
    <button type="button">احكيلي نكتة صعيدي</button>
    <button type="button">اشرحلي يعني إيه ذكاء اصطناعي</button>
    <button type="button">اقترح عليّ أكلة النهارده</button>
  </div>

  <form id="form">
    <button type="button" class="mic" id="mic" title="تكلم" aria-label="تكلم">🎤</button>
    <textarea id="input" rows="1" placeholder="اكتب هنا يا بيه..." aria-label="رسالتك"></textarea>
    <button class="send" id="send" aria-label="إرسال">➤</button>
  </form>
</div>

<dialog id="dlg">
  <h2>الإعدادات</h2>

  <label for="groqKey">مفتاح Groq</label>
  <input type="password" id="groqKey" placeholder="gsk_..." autocomplete="off">

  <label for="gemKey">مفتاح Gemini</label>
  <input type="password" id="gemKey" placeholder="AIza..." autocomplete="off">
  <p class="note">المفاتيح بتتحفظ في متصفحك إنت بس.</p>

  <label for="mode">المحرك</label>
  <select id="mode">
    <option value="auto">تلقائي (سريع للقصير، قوي للطويل)</option>
    <option value="groq">Groq بس</option>
    <option value="gemini">Gemini بس</option>
  </select>

  <label for="theme">الشكل</label>
  <select id="theme">
    <option value="auto">حسب الجهاز</option>
    <option value="light">فاتح</option>
    <option value="dark">غامق</option>
  </select>

  <div class="row"><input type="checkbox" id="speak"><label for="speak">انطق الردود بصوت عالي</label></div>

  <div class="actions">
    <button type="button" id="cancel">إغلاق</button>
    <button type="button" class="primary" id="save">حفظ</button>
  </div>
</dialog>

<script>
/* ========= إعدادات المشروع (عدّل هنا) ========= */
const CONFIG = {
  groqModel:   "llama-3.3-70b-versatile",
  geminiModels: ["gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"],  // بيجرب الأول وبعدين اللي بعده لو الموديل مش متاح
  longThreshold: 140,      // الرسالة أطول من كده تروح لـ Gemini في الوضع التلقائي
  maxHistory: 12,          // عدد الرسائل اللي بتتبعت للمحرك كسياق
  temperature: 0.8
};

const SYSTEM_PROMPT = `إنت "الكبير" (AlKabeer AI)، مساعد ذكي من صعيد مصر.
- اتكلم دايماً باللهجة الصعيدية، وبسيط وودود، وناديني "يا بيه" أو "يا باشا" أو "يا غالي" بشكل طبيعي.
- ردودك خفيفة وقصيرة: من جملتين لأربع جمل، إلا لو السؤال محتاج شرح أكتر.
- استخدم كلمات صعيدية زي: "إيوه"، "لاه"، "دِه"، "إكده"، "هوّي"، "عاد"، "يا ولد"، "جِدع"، "ما تشيلش هم"، "على راسي".
- لو السؤال تقني أو علمي، اشرح صح وبالبساطة، والمعلومة تفضل دقيقة.
- ما تألفش معلومات، ولو مش عارف قول "والله ما أعرف يا بيه".
- ما تستخدمش ألفاظ جارحة، وخليك محترم دايماً.`;

/* ========= حالة التطبيق ========= */
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("send");
let history = [];
let busy = false;

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const settings = {
  groqKey: store.get("ak_groq", ""),
  gemKey:  store.get("ak_gem", ""),
  mode:    store.get("ak_mode", "auto"),
  theme:   store.get("ak_theme", "auto"),
  speak:   store.get("ak_speak", "0") === "1"
};

function applyTheme(){
  if (settings.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", settings.theme);
}
applyTheme();

/* ========= واجهة الرسائل ========= */
function addMsg(text, who, opts = {}){
  const el = document.createElement("div");
  el.className = "msg " + who + (opts.err ? " err" : "");
  el.textContent = text;
  if (who === "bot" && !opts.err && !opts.typing){
    const meta = document.createElement("div");
    meta.className = "meta";
    if (opts.engine){ const s = document.createElement("span"); s.textContent = opts.engine; meta.appendChild(s); }
    const play = document.createElement("button");
    play.type = "button"; play.textContent = "🔊 اسمع";
    play.onclick = () => speakText(text);
    const copy = document.createElement("button");
    copy.type = "button"; copy.textContent = "نسخ";
    copy.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(text).then(() => { copy.textContent = "اتنسخ ✓"; setTimeout(() => copy.textContent = "نسخ", 1500); }).catch(() => {}); };
    meta.append(play, copy);
    el.appendChild(meta);
  }
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}
function showTyping(){
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

/* ========= المحركات ========= */
async function fetchT(url, opts){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 25000);
  try { return await fetch(url, { ...opts, signal: c.signal }); }
  catch(e){ throw new Error(e.name === "AbortError" ? "الرد اتأخر قوي (انتهت المهلة)" : "الاتصال فشل - اتأكد من النت أو افتح الملف من متصفح عادي"); }
  finally { clearTimeout(t); }
}
async function callGroq(msgs){
  if (!settings.groqKey) throw new Error("مفتاح Groq مش موجود");
  const r = await fetchT("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + settings.groqKey },
    body: JSON.stringify({
      model: CONFIG.groqModel,
      temperature: CONFIG.temperature,
      messages: [{ role: "system", content: SYSTEM_PROMPT }, ...msgs]
    })
  });
  if (!r.ok) throw new Error("Groq " + r.status + ": " + (await r.text()).replace(/\s+/g, " ").slice(0, 140));
  const d = await r.json();
  const t = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
  if (!t) throw new Error("Groq رجّع رد فاضي");
  return t.trim();
}

async function callGemini(msgs){
  if (!settings.gemKey) throw new Error("مفتاح Gemini مش موجود");
  let lastErr = null;
  for (const model of CONFIG.geminiModels){
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent";
    const r = await fetchT(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": settings.gemKey },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: msgs.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
        generationConfig: { temperature: CONFIG.temperature }
      })
    });
    if (r.status === 404){ lastErr = new Error("Gemini: الموديل " + model + " مش متاح"); continue; }
    if (!r.ok) throw new Error("Gemini " + r.status + ": " + (await r.text()).replace(/\s+/g, " ").slice(0, 140));
    const d = await r.json();
    const parts = d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts;
    const t = parts && parts.map(p => p.text || "").join("");
    if (!t) throw new Error("Gemini رجّع رد فاضي");
    return t.trim();
  }
  throw lastErr || new Error("Gemini: مفيش موديل متاح");
}

function pickOrder(text){
  if (settings.mode === "groq") return ["groq"];
  if (settings.mode === "gemini") return ["gemini"];
  const complex = text.length > CONFIG.longThreshold || /اشرح|حلل|قارن|اكتب|برمج|كود|ترجم|لخص/.test(text);
  return complex ? ["gemini", "groq"] : ["groq", "gemini"];
}

async function ask(text){
  const msgs = history.slice(-CONFIG.maxHistory);
  const order = pickOrder(text);
  const errs = [];
  for (const eng of order){
    try {
      const reply = eng === "groq" ? await callGroq(msgs) : await callGemini(msgs);
      return { reply, engine: eng === "groq" ? "Groq" : "Gemini" };
    } catch(e){ errs.push(e.message); }
  }
  throw new Error(errs.join("\n") || "مفيش محرك شغال");
}

/* ========= الإرسال ========= */
async function send(text){
  text = text.trim();
  if (!text || busy) return;
  if (!settings.groqKey && !settings.gemKey){ openSettings(); addMsg("حط مفتاح واحد على الأقل من الإعدادات يا بيه، وبعدها نتكلم.", "bot", { err: true }); return; }
  busy = true; sendBtn.disabled = true;
  $("chips").style.display = "none";
  addMsg(text, "user");
  history.push({ role: "user", content: text });
  input.value = ""; autoSize();
  const t = showTyping();
  $("status").textContent = "بيفكر...";
  try {
    const { reply, engine } = await ask(text);
    t.remove();
    history.push({ role: "assistant", content: reply });
    addMsg(reply, "bot", { engine });
    if (settings.speak) speakText(reply);
  } catch(e){
    t.remove();
    history.pop();
    addMsg("حصلت مشكلة يا بيه: " + e.message, "bot", { err: true });
  } finally {
    busy = false; sendBtn.disabled = false;
    $("status").textContent = "الكبير · جاهز يا بيه";
  }
}

/* ========= الصوت ========= */
function speakText(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ar-EG"; u.rate = 0.95;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ar-eg"))
         || speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
$("mic").onclick = () => {
  if (!SR){ addMsg("المتصفح ده مش بيدعم الكلام. جرب Chrome يا بيه.", "bot", { err: true }); return; }
  if (listening){ rec && rec.stop(); return; }
  rec = new SR();
  rec.lang = "ar-EG"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = () => { listening = true; $("mic").classList.add("on"); };
  rec.onend = () => { listening = false; $("mic").classList.remove("on"); };
  rec.onerror = () => { listening = false; $("mic").classList.remove("on"); };
  rec.onresult = e => { const s = e.results[0][0].transcript; send(s); };
  rec.start();
};

/* ========= أحداث الواجهة ========= */
function autoSize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 130) + "px"; }
input.addEventListener("input", autoSize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); } });
$("form").addEventListener("submit", e => { e.preventDefault(); send(input.value); });
$("chips").addEventListener("click", e => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });

$("clearBtn").onclick = () => {
  history = []; chat.innerHTML = ""; $("chips").style.display = "flex";
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  welcome();
};

const dlg = $("dlg");
function openSettings(){
  $("groqKey").value = settings.groqKey; $("gemKey").value = settings.gemKey;
  $("mode").value = settings.mode; $("theme").value = settings.theme; $("speak").checked = settings.speak;
  if (!dlg.open) dlg.showModal();
}
$("setBtn").onclick = openSettings;
$("cancel").onclick = () => dlg.close();
$("save").onclick = () => {
  settings.groqKey = $("groqKey").value.trim(); settings.gemKey = $("gemKey").value.trim();
  settings.mode = $("mode").value; settings.theme = $("theme").value; settings.speak = $("speak").checked;
  store.set("ak_groq", settings.groqKey); store.set("ak_gem", settings.gemKey);
  store.set("ak_mode", settings.mode); store.set("ak_theme", settings.theme); store.set("ak_speak", settings.speak ? "1" : "0");
  applyTheme(); dlg.close();
};

function welcome(){
  addMsg("يا مرحب بيك يا بيه! أنا الكبير. اسألني في أي حاجة وأنا تحت أمرك.", "bot");
}
welcome();
if (!settings.groqKey && !settings.gemKey) setTimeout(openSettings, 400);
</script>
